        - article [ref=f1e167]:
          - generic [ref=f1e168]:
            - generic [ref=f1e169]: 心理学
            - heading "认知失调" [level=1] [ref=f1e170]
            - generic [ref=f1e171]: Cognitive Dissonance
          - generic [ref=f1e172]:
            - heading "核心机制" [level=2] [ref=f1e173]
            - paragraph [ref=f1e174]: Festinger 1957年提出：当一个人同时持有两个互相矛盾的认知（信念、态度、行为），会产生心理不适——这种不适就是认知失调。人会主动减少失调，方法有两种：改变行为，或改变认知。大多数人选后者，因为改想法比改行为容易。
            - paragraph [ref=f1e175]: Festinger 和 Carlsmith 1959年的经典实验：被试做了一小时极其无聊的任务，然后被要求告诉下一位被试「这个任务很有趣」。说谎后被付1美元的被试，比被付20美元的被试，更倾向在后续问卷中说任务确实有趣。逻辑是：20美元给了充分的外部理由（「我是为了钱才这么说的」），没有失调；1美元不够构成充分理由，「我说了任务有趣但我其实觉得无聊」产生失调，消除失调的方式就是让自己相信任务确实有趣。
            - paragraph [ref=f1e176]:
              - text: 认知失调的三个核心情境：
              - strong [ref=f1e177]: 信念-行为失调
              - text: ——做了违背信念的事（说了谎、买了不该买的东西），改变信念来为行为辩护；
              - strong [ref=f1e178]: 努力正当化
              - text: ——付出了高昂代价加入的群体，比轻松加入的群体被评价更高（「这么难进，一定值得」）；
              - strong [ref=f1e179]: 选择后失调
              - text: ——做出选择后，被选中的选项被高估，被放弃的选项被贬低，以减少「选错了」的不适。
            - paragraph [ref=f1e180]:
              - text: 与
              - link "道德直觉" [ref=f1e181] [cursor=pointer]:
                - /url: "#/concept/%E9%81%93%E5%BE%B7%E7%9B%B4%E8%A7%89"
              - text: 的关系：道德直觉是判断先于论证，认知失调是行为先于信念调整——两者都指向同一个结论：人不是先想清楚再行动的，是先行动再调整想法来匹配行动。与
              - link "承诺升级" [ref=f1e182] [cursor=pointer]:
                - /url: "#/concept/%E6%89%BF%E8%AF%BA%E5%8D%87%E7%BA%A7"
              - text: 的关系：承诺升级是认知失调在组织决策中的表现——投入越多，越需要相信投入是对的，失调越大，辩护越强，投入越多。与
              - link "动机性推理" [ref=f1e183] [cursor=pointer]:
                - /url: "#/concept/%E5%8A%A8%E6%9C%BA%E6%80%A7%E6%8E%A8%E7%90%86"
              - text: 的关系：动机性推理是认知失调的主动形式——你不是被动地感到不适然后调整，你主动寻找支持现有信念的证据来预防失调。
            - heading "入口场景" [level=2] [ref=f1e184]
            - paragraph [ref=f1e185]: 小邱在专柜犹豫三周，翻遍差评，仍刷卡买下那只贵包。回家当晚，她又打开差评页，皱眉说：「这人不懂皮料」「品味差远了」「怕是假货。」室友问：「你买前也这么说的？」小邱答：「买前是参考，买后是确认。」
            - paragraph [ref=f1e186]: 一周后闺蜜来家里，小邱把包捧出来，讲工艺、讲限量，差评一字不提。闺蜜说：「真好，你眼光稳。」小邱笑，心里那团「也许买亏了」轻了些。
            - paragraph [ref=f1e187]: 闺蜜走后，她对着镜子背了一次，越看越顺眼。她给专柜发消息问保养，没问能不能退。夜里刷到同款二手价更低，她划走，嘀咕：「二手水太深。」
            - paragraph [ref=f1e188]: 手机熄屏，包搁在椅背。她没算自己改了多少次说法，只觉得——既然已经背给人看过，它就得是好包；好包的人，不会买错。至于差评，她决定明天不再点开，像关掉一扇还没吵完的门。
            - paragraph [ref=f1e189]: 室友半夜起来喝水，瞥见她对着椅背发呆。室友问：「后悔了？」小邱摇头：「没有，就是……得把它想成对的。」她伸手摸了摸皮面，像确认一件已经发生的事。窗外有车灯扫过，包上的金属扣闪了一下，她没移开视线。
            - heading "现实锚点" [level=2] [ref=f1e190]
            - list [ref=f1e191]:
              - listitem [ref=f1e192]:
                - strong [ref=f1e193]: 邪教成员的末日预言失败
                - text: ：Festinger 最初的研究灵感来自一个真实事件：一个邪教预言某日世界末日，信徒放弃财产等待。末日没来。按理说信徒应该醒悟——预言错了。但事实相反：信徒更加虔诚，他们解释为「我们的虔诚感动了上帝，推迟了末日」。预言失败产生的失调，被重新解释消除了。这比承认错误容易得多。
            - list [ref=f1e194]:
              - listitem [ref=f1e195]:
                - strong [ref=f1e196]: 戒烟者的认知调整
                - text: ：研究发现，戒烟失败的人比从未尝试戒烟的人更倾向低估吸烟的危害——「没那么严重」「我爷爷抽到九十」「反正空气也不好」。戒烟失败+吸烟有害=严重失调，降低「吸烟危害」的信念是消除失调最廉价的策略。
            - heading "适用边界" [level=2] [ref=f1e197]
            - paragraph [ref=f1e198]: 认知失调的发生需要两个条件：行为是自愿的，且后果是可预见的。被迫做的事不产生失调（「我没得选」），不可预见的后果也不产生失调（「我怎么知道会这样」）。当人能找到外部归因，失调就被外部理由替代了。
            - paragraph [ref=f1e199]: 另一个边界：认知失调的强度因自我卷入度而异。跟你核心价值观无关的事，失调很轻，你不会费劲调整。但涉及身份、道德、重大选择的事，失调极强，调整也极剧烈。这也是为什么意识形态争论比事实争论更难调和——事实错误只威胁判断，意识形态错误威胁身份。
